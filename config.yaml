# ---------------------------------------------------------------------------
# Central config. Every script reads this. Override the raw CSV path here.
# ---------------------------------------------------------------------------

paths:
  raw_csv: "Primary Customer Support on Twitter Dataset/twcs/twcs.csv"
  processed_dir: "data/processed"
  golden_dir: "data/golden"
  reports_dir: "reports"

data_prep:
  # If null, scripts/pick_brand.py chooses the brand and writes it back here.
  brand: "AppleSupport"
  # Chronological split: threads before `split_date` become the agent's
  # "historical memory"; threads on/after are the pool we sample eval from.
  # This prevents the agent retrieving a reply it is being tested on.
  split_date: "2017-11-15"
  min_thread_turns: 2           # need at least 1 customer + 1 brand turn
  max_history_threads: 30000    # BM25 index cap; sampled across the whole pre-split window
  eval_pool_size: 1500          # candidate pool the golden set is sampled from
  random_seed: 13

llm:
  # provider: ollama | openai | gemini | groq | deepseek | xai | openrouter | mock
  # All are OpenAI-compatible; base_url + api_key_env are built in (src/llm.py
  # _PRESETS) and can be overridden per block here.
  provider: "gemini"

  ollama:                      # local, free, slow on CPU (~1 min/message)
    model: "llama3.1:8b"
    judge_model: "llama3.1:8b"

  gemini:                      # FREE tier. Key: https://aistudio.google.com/apikey
    api_key_env: "GEMINI_API_KEY"
    model: "gemini-3.1-flash-lite"
    judge_model: "gemini-3.1-flash-lite"
    rpm: 18                   # free-tier headroom; 429s are backed off automatically

  groq:                        # FREE tier: ~30 rpm. Key: https://console.groq.com/keys
    api_key_env: "GROQ_API_KEY"
    model: "llama-3.3-70b-versatile"
    judge_model: "llama-3.3-70b-versatile"
    rpm: 28

  openai:                      # paid. Key: OPENAI_API_KEY
    model: "gpt-4o-mini"
    judge_model: "gpt-4o"

  deepseek:                    # very cheap (~$0.20 for the whole assignment), not free
    api_key_env: "DEEPSEEK_API_KEY"
    model: "deepseek-chat"
    judge_model: "deepseek-chat"

  temperature: 0.0
  max_tokens: 512
  cache_dir: ".llm_cache"
  timeout_s: 120

retrieval:
  method: "bm25"                # bm25 | tfidf
  k: 4                          # exemplars shown to the drafter
  min_score: 3.0               # below this the drafter is told "no strong precedent"

escalation:
  # Auto-handle only if ALL of these hold; otherwise escalate.
  min_intent_confidence: 0.60
  min_retrieval_score: 3.0
  # Intents that are never auto-handled regardless of confidence (slugs from src/intents.py).
  always_escalate_intents:
    - "account_access_security"
    - "billing_appstore_subscription"
    - "complaint_churn_risk"
  # Regexes (case-insensitive) that force escalation from the raw message.
  hard_escalation_patterns:
    - "\\b(lawyer|legal|sue|lawsuit|attorney|ombudsman|gdpr|ferpa)\\b"
    - "\\b(fraud|hacked|unauthori[sz]ed|stolen|identity theft)\\b"
    - "\\b(cancel|close) my account\\b"
    - "\\b(refund|reimburse|compensat)"
    - "\\b(dying|suicid|self.harm|emergency)\\b"

eval:
  golden_set: "data/golden/golden_set.jsonl"
  judge_human_scores: "data/golden/judge_human_scores.csv"
  results_json: "reports/results.json"
  results_md: "reports/results.md"
